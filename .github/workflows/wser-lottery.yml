name: WSER lottery odds

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 h (UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Recompute even if wser.org has not changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wser-lottery
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install numpy==2.1.3

      - name: Fetch hat and simulate
        env:
          DRAW_SIZE: "290"
          SIMS: "20000"
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python scripts/wser_lottery.py

      - name: Commit if something changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wser/live.json assets/wser/history.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "WSER odds: $(python -c "import json;print(json.load(open('assets/wser/live.json'))['wser_last_updated'])")"
            git pull --rebase --autostash
            git push
          fi