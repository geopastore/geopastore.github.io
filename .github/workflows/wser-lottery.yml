name: WSER lottery odds

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 h (UTC), off the busy top of the hour
  workflow_dispatch:
    inputs:
      force:
        description: "Recompute even if wser.org has not changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wser-lottery
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install numpy==2.1.3

      - name: Fetch hat and simulate
        env:
          DRAW_SIZE: "290"
          SIMS: "20000"
          FORCE: ${{ inputs.force && '1' || '0' }}
          # LOTTERY_URL: "https://www.wser.org/lottery2027.html"  # optional override
        run: python scripts/wser_lottery.py

      - name: Commit if something changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wser/live.json assets/wser/history.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "WSER odds: $(python -c "import json;print(json.load(open('assets/wser/live.json'))['wser_last_updated'])")"
            git push
          fi
