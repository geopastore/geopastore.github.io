<!DOCTYPE html>
<html>
<head>
  <title>3D Flute Casts</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #111; }
    model-viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="/models/flute1/model.glb"
    alt="3D Flute Casts"
    camera-controls
    camera-orbit="0deg 75deg 2m"
    min-camera-orbit="0deg 0deg 0.5m"
    max-camera-orbit="180deg 180deg 5m"
    field-of-view="10deg"
    exposure="0.35"
    shadow-intensity="0.2"
    environment-image="neutral">
  </model-viewer>

  <script>
    const viewer = document.getElementById('viewer');

    // --- ZOOM (scroll wheel) ---
    viewer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const orbit = viewer.getCameraOrbit();
      const sensitivity = 0.01;
      const newRadius = Math.max(0.5, Math.min(5, orbit.radius + e.deltaY * sensitivity));
      // Preserve theta and phi exactly, only change radius
      viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${newRadius}m`;
    }, { passive: false });

    // --- PAN (right-click or middle-click drag) ---
    let isPanning = false;
    let lastX, lastY;

    viewer.addEventListener('mousedown', (e) => {
      if (e.button === 1 || e.button === 2) {
        isPanning = true;
        lastX = e.clientX;
        lastY = e.clientY;
        e.preventDefault();
      }
    });

    viewer.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      const deltaX = (e.clientX - lastX) * 0.001;
      const deltaY = (e.clientY - lastY) * 0.001;
      const target = viewer.getCameraTarget();
      viewer.cameraTarget = `${target.x - deltaX}m ${target.y + deltaY}m ${target.z}m`;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    viewer.addEventListener('mouseup', () => isPanning = false);
    viewer.addEventListener('mouseleave', () => isPanning = false);

    viewer.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>

</body>
</html>
